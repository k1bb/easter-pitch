<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ambient candlelight glow -->
    <radialGradient id="candleGlow" cx="50%" cy="58%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.2" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Outer flame gradient (Warm deep amber to vibrant red-orange) -->
    <linearGradient id="flameOuterGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="20%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="80%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Inner flame core (Bright glowing hot gold & white) -->
    <linearGradient id="flameInnerGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef9c3" />
      <stop offset="70%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Blue flame base -->
    <radialGradient id="flameBlueBase" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- OLED True Black -->
  <rect width="512" height="512" fill="#000000" />

  <!-- Ambient Light Halo -->
  <circle cx="256" cy="270" r="230" fill="url(#candleGlow)" />

  <!-- Tiny Wick Base at bottom -->
  <path d="M 256 430 L 256 380" stroke="#451a03" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="382" r="5" fill="#f97316" />

  <!-- Main Candle Flame Silhouette (Teardrop fire) -->
  <!-- Outer Flame Body -->
  <path d="M 256 50 
           C 200 160, 150 250, 165 330 
           C 180 395, 230 425, 256 425 
           C 282 425, 332 395, 347 330 
           C 362 250, 312 160, 256 50 Z" 
        fill="url(#flameOuterGrad)" 
        filter="url(#softGlow)" />

  <!-- Blue Gas Base at bottom of flame -->
  <ellipse cx="256" cy="395" rx="42" ry="25" fill="url(#flameBlueBase)" />

  <!-- Mid Flame Layer (Vibrant Orange-Yellow) -->
  <path d="M 256 100 
           C 215 190, 185 260, 195 330 
           C 205 385, 240 405, 256 405 
           C 272 405, 307 385, 317 330 
           C 327 260, 297 190, 256 100 Z" 
        fill="#f59e0b" 
        opacity="0.95" />

  <!-- Inner Bright White/Yellow Core -->
  <path d="M 256 140 
           C 228 215, 208 275, 218 335 
           C 225 375, 248 390, 256 390 
           C 264 390, 287 375, 294 335 
           C 304 275, 284 215, 256 140 Z" 
        fill="url(#flameInnerGrad)" />

  <!-- Pure White Heart -->
  <ellipse cx="256" cy="320" rx="18" ry="45" fill="#ffffff" opacity="0.85" />
</svg>
